[project]
name = "erpnext_ai_assistant"
authors = [
    { name = "Ahmed Abdelrahman", email = "ahmad18189@gmail.com" }
]
description = "Arabic and English chat assistant for Frappe and ERPNext. Ask questions, see charts, and approve changes inside Desk."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]
dependencies = [
    "rdflib>=7.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "erpnext_ai_assistant"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
